<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="GungDev — asisten AI berbahasa Indonesia yang ramah, akurat, dan jelas."
    />

    <!--
      Ikon situs (favicon). PNG dipakai karena logo aslinya gambar PNG
      dan RGB-nya kaya; SVG hasil vektorisasi otomatis ternyata tidak
      setia pada garis aslinya, jadi tidak dipakai.
    -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="GungDev" />
    <meta name="application-name" content="GungDev" />

    <!-- Pratinjau saat tautan dibagikan (WhatsApp, X, Telegram, dsb.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GungDev" />
    <meta property="og:title" content="GungDev" />
    <meta
      property="og:description"
      content="GungDev — asisten AI berbahasa Indonesia yang ramah, akurat, dan jelas."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GungDev" />
    <meta
      name="twitter:description"
      content="GungDev — asisten AI berbahasa Indonesia yang ramah, akurat, dan jelas."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <title>GungDev</title>

    <!--
      Skrip anti-flash: dijalankan SEBELUM React render, sehingga warna latar
      dan tema sudah benar sejak frame pertama (tidak ada kedipan putih).
    -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('gungdev:theme') || 'system';
          var isDark = false;
          if (pref === 'dark') isDark = true;
          else if (pref === 'light') isDark = false;
          else isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var root = document.documentElement;
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');

          var size = localStorage.getItem('gungdev:settings');
          if (size) {
            var parsed = JSON.parse(size);
            if (parsed && parsed.fontSize) root.setAttribute('data-fontsize', parsed.fontSize);
          }
          root.style.backgroundColor = isDark ? '#1f1e1d' : '#faf9f5';
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
