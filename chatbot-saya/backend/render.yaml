# ==========================================================
# Blueprint deploy Render (opsional)
# ==========================================================
# Cara pakai:
#   1. Push repo ke GitHub
#   2. Render Dashboard -> New -> Blueprint
#   3. Pilih repo ini, Render membaca file ini otomatis
#   4. Isi GROQ_API_KEY saat diminta
# ==========================================================
services:
  - type: web
    name: gungdev-api
    runtime: docker
    dockerfilePath: ./chatbot-saya/backend/Dockerfile
    dockerContext: ./chatbot-saya/backend
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false # diisi manual di dashboard (rahasia)
      - key: ALLOWED_ORIGINS
        sync: false # mis. https://gungdev-chatbot.vercel.app
      - key: PYTHONUNBUFFERED
        value: "1"
